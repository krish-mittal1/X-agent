# Production compose. Local dev keeps compose.yaml (no browser, scheduler off,
# free-form). Do not run compose.prod.yaml anywhere except the target VPS.
# Source of truth for secrets is the server's .env (chmod 600, not committed).
#
# This stack is expected to share a host with unrelated projects, so it is
# namespaced and capped: explicit project name (containers, network and volumes
# all get this prefix), loopback-only port binding, and per-service CPU/memory
# ceilings so a Chromium or embedding spike cannot starve the neighbours.
name: techx-agent

# Shared production settings. Outbound actions default to a safe staging state;
# the operator must enable each capability explicitly in the server's .env.
x-prod-flags: &prod-flags
  APP_ENV: production
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
  DRAFTING_ENABLED: ${DRAFTING_ENABLED:-true}
  DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
  PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
  DRY_RUN: ${DRY_RUN:-true}
  X_API_ENABLED: "false"
  X_PUBLISHING_MODE: ${X_PUBLISHING_MODE:-local_draft}
  X_READS_ENABLED: ${X_READS_ENABLED:-false}
  X_RESEARCH_ENABLED: ${X_RESEARCH_ENABLED:-false}
  ENABLE_REPLY_SCANNER: ${ENABLE_REPLY_SCANNER:-false}
  AI_REPLY_APPROVAL_OBTAINED: ${AI_REPLY_APPROVAL_OBTAINED:-false}
  AI_REPLY_PUBLISHING_ENABLED: ${AI_REPLY_PUBLISHING_ENABLED:-false}
  # Container networking overrides any localhost URL in .env.
  DATABASE_URL: postgresql+asyncpg://techx:${POSTGRES_PASSWORD:-techx}@db:5432/techx

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techx}
      POSTGRES_USER: ${POSTGRES_USER:-techx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techx -d techx"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEMORY_LIMIT:-1g}

  app:
    build:
      context: .
    image: techx-agent:prod
    env_file:
      - path: .env
        required: false
    environment:
      <<: *prod-flags
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      EMBEDDING_DEVICE: cpu
      EMBEDDING_CACHE: "true"
      # --- per-instance / tunables (may come from .env) ------------------
      X_PERSONA_HANDLE: ${X_PERSONA_HANDLE:-ssh_bugs}
      X_AUTH_TOKEN: ${X_AUTH_TOKEN:-}
      X_CT0: ${X_CT0:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-0.0}
      LLM_MAX_REQUESTS_PER_DAY: ${LLM_MAX_REQUESTS_PER_DAY:-500}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-60}
      DRAFT_INTERVAL_MINUTES: ${DRAFT_INTERVAL_MINUTES:-240}
      PUBLISH_INTERVAL_MINUTES: ${PUBLISH_INTERVAL_MINUTES:-60}
      OUTBOUND_ENGAGEMENT_INTERVAL_MINUTES: ${OUTBOUND_ENGAGEMENT_INTERVAL_MINUTES:-240}
      OUTBOUND_ENGAGEMENT_ENABLED: ${OUTBOUND_ENGAGEMENT_ENABLED:-true}
      OUTBOUND_MIN_IMPRESSIONS: ${OUTBOUND_MIN_IMPRESSIONS:-10000}
      VIRAL_VIDEO_REPOST_ENABLED: ${VIRAL_VIDEO_REPOST_ENABLED:-true}
      VIRAL_VIDEO_REPOST_INTERVAL_MINUTES: ${VIRAL_VIDEO_REPOST_INTERVAL_MINUTES:-360}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      MAX_ORIGINAL_POSTS_PER_DAY: ${MAX_ORIGINAL_POSTS_PER_DAY:-3}
      MAX_REPLIES_PER_DAY: ${MAX_REPLIES_PER_DAY:-5}
      MIN_HOURS_BETWEEN_POSTS: ${MIN_HOURS_BETWEEN_POSTS:-3.5}
      MAX_POSTS_PER_RUN: ${MAX_POSTS_PER_RUN:-1}
      MAX_CANDIDATES_PER_RUN: ${MAX_CANDIDATES_PER_RUN:-5}
      GROWTH_FOLLOW_TARGETS: ${GROWTH_FOLLOW_TARGETS:-gharkekalesh,DeadlyKalesh,KaleshChahiye,sagarcasm,GabbbarSingh,coolfunnytshirt,Trend_ulkar,memenist,desimojito,thetatva,mufaddal_vohra,CricCrazyJohns,IndianTechGuide,peakbengaluru,filmy_gyan}
      VIRAL_TARGET_HANDLES: ${VIRAL_TARGET_HANDLES:-gharkekalesh,DeadlyKalesh,KaleshChahiye,crazyclips_,sagarcasm,GabbbarSingh,coolfunnytshirt,Trend_ulkar,memenist,desimojito,thetatva,HasnaZarooriHai,TupacShakur_IND,mufaddal_vohra,CricCrazyJohns,Johns_Cricket,IndianTechGuide,peakbengaluru,filmy_gyan,tellychakkar}
    ports:
      # Loopback only, non-default host port: nothing is exposed to the
      # internet, and a neighbour already holding 8000 does not break startup.
      # Reach the API/dashboard over an SSH tunnel instead:
      #   ssh -L ${APP_HOST_PORT:-8100}:127.0.0.1:${APP_HOST_PORT:-8100} user@host
      - "127.0.0.1:${APP_HOST_PORT:-8100}:8000"
    volumes:
      # Persistent temp dir for image attachment downloads (avoids a 12s
      # download on every post).
      - media_tmp:/app/.temp_media
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        # Headless Chromium plus the embedding model live here; without a cap
        # this is the service that would take the whole box down.
        limits:
          cpus: "${APP_CPUS:-2.0}"
          memory: ${APP_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  # Failure alarm. A green container proves nothing: an expired cookie session
  # or a stalled scheduler both look healthy from outside. This checks post
  # freshness, publish failures, scheduler liveness and auth-shaped errors every
  # 15 minutes, then POSTs to ALERT_WEBHOOK_URL when something is wrong.
  #
  # It shares *prod-flags with app on purpose: the freshness and publish-loop
  # checks only apply when the monitor also believes publishing is live.
  monitor:
    build:
      context: .
    image: techx-agent:prod
    env_file:
      - path: .env
        required: false
    environment:
      <<: *prod-flags
      MONITOR_BASE_URL: http://app:8000
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      MAX_POST_AGE_HOURS: ${MAX_POST_AGE_HOURS:-6}
      MAX_PUBLISH_FAILURES: ${MAX_PUBLISH_FAILURES:-3}
    command:
      ["sh", "-c", "while true; do python -m scripts.monitor --quiet; sleep 900; done"]
    # The image's default healthcheck probes the app's HTTP port.  The monitor
    # service has no HTTP server, so override it with the actual monitor probe;
    # otherwise Docker reports this healthy sidecar as permanently unhealthy.
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.monitor", "--quiet"]
      interval: 5m
      timeout: 45s
      start_period: 45s
      retries: 3
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MONITOR_CPUS:-0.5}"
          memory: ${MONITOR_MEMORY_LIMIT:-256m}

volumes:
  pgdata:
  media_tmp:
