name: Linux integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://x_agent_ci:ci-only-password@127.0.0.1:5432/x_agent_test
      TEST_DATABASE_URL: postgresql+asyncpg://x_agent_ci:ci-only-password@127.0.0.1:5432/x_agent_test
      X_PUBLISHING_MODE: local_draft
      PUBLISHING_ENABLED: "false"
      DRY_RUN: "true"
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: x_agent_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: x_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x_agent_ci -d x_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-embeddings.txt

      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify Python and asyncio
        run: |
          python --version
          python -c "import asyncio; asyncio.run(asyncio.sleep(0)); print('ASYNCIO_OK')"

      - name: Verify disposable PostgreSQL databases and pgvector
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h 127.0.0.1 -U x_agent_ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE x_agent_migration_test"
          psql -h 127.0.0.1 -U x_agent_ci -d x_agent_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h 127.0.0.1 -U x_agent_ci -d x_agent_migration_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h 127.0.0.1 -U x_agent_ci -d x_agent_test -v ON_ERROR_STOP=1 -c "SELECT current_database(), extname FROM pg_extension WHERE extname = 'vector'"

      - name: Validate migrations in a separate disposable database
        env:
          DATABASE_URL: postgresql+asyncpg://x_agent_ci:ci-only-password@127.0.0.1:5432/x_agent_migration_test
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Run previously blocked analytics integration test
        run: pytest -vv -s tests/integration/test_analytics.py::test_metrics_are_collected_and_evaluated

      - name: Run unit tests
        run: pytest -q tests/unit

      - name: Run integration tests
        run: pytest -q tests/integration

      - name: Run complete pytest suite
        run: pytest -q

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app
